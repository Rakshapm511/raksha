<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login</title>
<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #141e30, #243b55); /* your previous background */
    }

    .login-box{
        width:380px;
        padding:40px;
        border-radius:15px;
        background: rgba(0,0,0,0.6);
        box-shadow:0 10px 30px rgba(0,0,0,0.5);
        text-align:center;
        color:white;
    }

    h2{
        margin-bottom:25px;
        font-weight:600;
        letter-spacing:1px;
    }

    input{
        width:100%;
        padding:12px;
        margin:10px 0;
        border-radius:6px;
        border:none;
        outline:none;
        background: rgba(255,255,255,0.15);
        color:white;
        font-size:14px;
        transition:0.3s;
    }

    input::placeholder{
        color:#ccc;
    }

    input:focus{
        background: rgba(255,255,255,0.25);
        box-shadow:0 0 5px rgba(0,198,255,0.6);
    }

    button{
        width:100%;
        padding:12px;
        margin-top:15px;
        border:none;
        border-radius:6px;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color:white;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:scale(1.05);
        box-shadow:0 0 15px rgba(0,114,255,0.6);
    }

    .error{
        color:#ff6b6b;
        font-size:13px;
        margin-bottom:10px;
    }
    form{
    text-align:left;
}

label{
    font-size:14px;
    font-weight:500;
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    color:#ddd;
}

input{
    width:100%;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>👩‍🏫 Teacher Login📋</h2>
    {% if error %}
    <p style="color:red; font-size:12px;">
        {{ error }}
    </p>
    {% endif %}
    <form method="POST">

        
            <label>Teacher Username</label>
            <input type="text" name="username" required>
        


            <label>Password</label>
            <input type="password" name="password" required>
       

        <button type="submit">Login & Mark Attendance</button>

    </form>

    <div class="footer">
        Only authorized teachers can access attendance system.
    </div>

</div>

</body>
</html>
