<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>loginpage</title>
<style>
    body {
      background-color: rgb(0,25,58);
      margin: 0;
      padding: 0;
    }
   #mainDiv {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  }
.container {
  background-color: rgb(0,0,26);     
  width: 300px;
  border-radius: 20px;
  padding: 20px;
  margin: 0 auto;    
  position: relative;
}

.robot-gif {
  width: 120px;
  display: block;
  margin: 0 auto 10px auto;
  position: relative;
  z-index: 2;
}


    p {
      font-family: Arial;
      font-size: 15px;
      font-weight: bold;
      color: white;
      text-align: center;
      padding-top: 20px;
    }
    .input-group {
      margin-bottom: 2%;
    }
    label {
      font-family: Arial;
      font-size: 10px;
      color: rgb(0,247,255);
    }
    .text {
      all: unset;
      width:95%;
      background-color: transparent;
      color: white;
      font-family: Arial;
      border-bottom: solid 1px white;
      font-size: 12px;
    }
    .submit-btn {
      width:70px;
      height: 25px;
      font-family: 'Eras Demi ITC';
      font-size: 11px;
      color: white;
      background-color: rgb(0,247,255);
      border:none;
      border-radius: 5px;
      margin-top: 18%;
      margin-bottom: 15%;
     }
    .submit-btn:hover {
      box-shadow: 0 0 20px 7px rgb(55, 45, 145);
      cursor: pointer;
    }
    
  </style>

</head>
<body>
<div id="mainDiv">
  <img src="{{ url_for('static',filename='robot.gif')}}"class="robot-gif">
 <div class="container">
      <p>Admin login</p>
      
    {% if error %}
    <p style="color:red; font-size:12px; padding-top:5px;">
        {{ error }}
    </p>
    {% endif %}
    
      <form method="post">
      <label>Username</label>
      <input type="text" name="username" class="text" placeholder="enter Username"  required>
       <label>Password</label>
      <input type="password" name="password" class="text" placeholder="enter password" required>
       <input type="submit" value="SUBMIT"  class="submit-btn" required>
      </form>
      </div>
    </div>
</body>
</html>
